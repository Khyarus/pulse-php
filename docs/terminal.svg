<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Instalação e execução do PulsePHP no terminal">
  <defs>
    <style>
      .mono { font-family: 'IBM Plex Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <clipPath id="window"><rect x="1" y="1" width="898" height="358" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="900" height="360" fill="#17162a"/>
    <rect width="900" height="38" fill="#1f1d36"/>
    <path d="M0 38H900" stroke="#2e2b48" stroke-width="1"/>
  </g>
  <rect x="1" y="1" width="898" height="358" rx="12" fill="none" stroke="#2e2b48" stroke-width="2"/>

  <circle cx="24" cy="19" r="6" fill="#3d3959"/>
  <circle cx="44" cy="19" r="6" fill="#3d3959"/>
  <circle cx="64" cy="19" r="6" fill="#3d3959"/>
  <text x="450" y="24" class="sans" font-size="12.5" fill="#837d9d" text-anchor="middle">meu-projeto</text>

  <g class="mono" font-size="14.5">
    <text x="28" y="76" fill="#ff5c70">$</text>
    <text x="46" y="76" fill="#eeeaf6">composer require jgcansi/pulse-php</text>
    <text x="28" y="100" fill="#837d9d">  - Installing jgcansi/pulse-php (1.1.0)</text>

    <text x="28" y="138" fill="#ff5c70">$</text>
    <text x="46" y="138" fill="#eeeaf6">php artisan pulse:install</text>
    <text x="28" y="162" fill="#5cc79a">PulsePHP installed. Remaining steps:</text>

    <text x="28" y="200" fill="#ff5c70">$</text>
    <text x="46" y="200" fill="#eeeaf6">php artisan pulse:deploy v1.4.0</text>
    <text x="28" y="224" fill="#5cc79a">Marked deploy v1.4.0.</text>

    <text x="28" y="262" fill="#ff5c70">$</text>
    <text x="46" y="262" fill="#eeeaf6">php examples/traffic.php --iterations=3</text>
    <text x="28" y="286" fill="#b6b0cc">[16:41:02] GET /api/v1/orders - 412ms (200 OK) [api-vendas] queries=9 spans=2 outbound=1</text>
    <text x="28" y="310" fill="#b6b0cc">[16:41:04] POST /api/v1/checkout - 233ms <tspan fill="#ff5c70">(500 ERROR)</tspan> [api-vendas] queries=3 spans=1 outbound=0</text>
    <text x="28" y="334" fill="#b6b0cc">[16:41:05] GET /api/v1/profile - 118ms (200 OK) [auth-service] queries=2 spans=1 outbound=1</text>
  </g>
</svg>

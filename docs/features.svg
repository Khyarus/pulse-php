<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Recursos do PulsePHP">
  <defs>
    <style>
      .sans { font-family: 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .name { font-size: 16px; font-weight: 600; fill: #221d33; }
      .desc { font-size: 13.5px; fill: #565068; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="378" rx="12" fill="#ffffff" stroke="#e8e1e6" stroke-width="2"/>

  <g transform="translate(36 34)">
    <path d="M0 14h10l3 -8 5 17 4 -13 3 4H40" fill="none" stroke="#c8102e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="21" class="sans" font-size="20" font-weight="600" fill="#221d33">O que o PulsePHP acompanha</text>
  </g>
  <text x="36" y="84" class="sans desc">Tudo gravado localmente, num arquivo SQLite, e visto no dashboard embutido.</text>

  <!-- rules between rows and columns -->
  <path d="M36 112H864M36 178H864M36 244H864M36 310H864" stroke="#e8e1e6" stroke-width="1"/>
  <path d="M450 112V310" stroke="#e8e1e6" stroke-width="1"/>

  <g class="sans">
    <g transform="translate(36 112)">
      <rect x="0" y="22" width="4" height="26" rx="2" fill="#c8102e"/>
      <text x="18" y="36" class="name">Requisições e latência</text>
      <text x="18" y="55" class="desc">p95/p99, taxa de 5xx e comparação com o período anterior</text>
    </g>
    <g transform="translate(474 112)">
      <rect x="0" y="22" width="4" height="26" rx="2" fill="#4f5b93"/>
      <text x="18" y="36" class="name">Trace em cascata</text>
      <text x="18" y="55" class="desc">spans, queries e HTTP de cada request na linha do tempo</text>
    </g>
    <g transform="translate(36 178)">
      <rect x="0" y="22" width="4" height="26" rx="2" fill="#c8102e"/>
      <text x="18" y="36" class="name">Erros com ciclo de vida</text>
      <text x="18" y="55" class="desc">agrupados, resolvidos ou ignorados, com detecção de regressão</text>
    </g>
    <g transform="translate(474 178)">
      <rect x="0" y="22" width="4" height="26" rx="2" fill="#2e7d5b"/>
      <text x="18" y="36" class="name">Queries e N+1</text>
      <text x="18" y="55" class="desc">SQL normalizado e queries repetidas no mesmo request</text>
    </g>
    <g transform="translate(36 244)">
      <rect x="0" y="22" width="4" height="26" rx="2" fill="#4f5b93"/>
      <text x="18" y="36" class="name">Jobs, HTTP externo e logs</text>
      <text x="18" y="55" class="desc">filas, Guzzle e Http do Laravel, logs ligados ao request</text>
    </g>
    <g transform="translate(474 244)">
      <rect x="0" y="22" width="4" height="26" rx="2" fill="#a3650f"/>
      <text x="18" y="36" class="name">Alertas e deploys</text>
      <text x="18" y="55" class="desc">webhook, Slack e e-mail; marcadores de release nos gráficos</text>
    </g>
  </g>

  <text x="36" y="346" class="sans desc">Seguro por padrão: o dashboard fica fechado até você liberar com Gate, Basic Auth ou lista de IPs.</text>
</svg>

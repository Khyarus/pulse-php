<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Recursos do PulsePHP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset="1" stop-color="#0b100e"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42c98a"/>
      <stop offset="1" stop-color="#8ff0bf"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .ui   { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="300" rx="12" fill="url(#bg)" stroke="#2a3631" stroke-width="1.5"/>

  <!-- header -->
  <g transform="translate(40 40)">
    <rect width="34" height="34" rx="9" fill="#143b2c" stroke="#2a5a44"/>
    <path d="M8 17 H13 L16 9 L21 25 L25 14 L27 20 H29" fill="none" stroke="url(#spark)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="88" y="56" class="ui" font-size="20" font-weight="700" fill="#e8f0eb">Recursos do Pulse<tspan fill="#42c98a">PHP</tspan></text>
  <text x="88" y="78" class="ui" font-size="12" fill="#718078">tudo local, sem infraestrutura externa</text>

  <!-- cards row 1 -->
  <g>
    <!-- card -->
    <rect x="40" y="106" width="196" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(58 124)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <path d="M6 9 L12 15 L18 9" fill="none" stroke="#8ff0bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="92" y="136" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">Flush em lote</text>
    <text x="58" y="166" class="mono" font-size="11" fill="#718078">buffer em memória · zero overhead</text>

    <rect x="252" y="106" width="196" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(270 124)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <path d="M7 12 H17 M12 7 V17" fill="none" stroke="#8ff0bf" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="304" y="136" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">SQL normalizado</text>
    <text x="270" y="166" class="mono" font-size="11" fill="#718078">agrupa consultas equivalentes</text>

    <rect x="464" y="106" width="196" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(482 124)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <circle cx="12" cy="12" r="6" fill="none" stroke="#8ff0bf" stroke-width="2"/>
      <path d="M12 6 V12 L16 14" fill="none" stroke="#8ff0bf" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="516" y="136" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">Timers &amp; memória</text>
    <text x="482" y="166" class="mono" font-size="11" fill="#718078">duração e variação por operação</text>

    <rect x="676" y="106" width="184" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(694 124)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <path d="M12 6 L19 10 V14 C19 18 16 20 12 22 C8 20 5 18 5 14 V10 Z" fill="none" stroke="#8ff0bf" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="728" y="136" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">Seguro por padrão</text>
    <text x="694" y="166" class="mono" font-size="11" fill="#718078">Basic Auth · IPs · Gate</text>
  </g>

  <!-- cards row 2 -->
  <g>
    <rect x="40" y="196" width="196" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(58 214)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <path d="M6 18 L11 12 L15 15 L19 8" fill="none" stroke="#8ff0bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="92" y="226" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">Dashboard ao vivo</text>
    <text x="58" y="256" class="mono" font-size="11" fill="#718078">filtros por período, serviço e rota</text>

    <rect x="252" y="196" width="196" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(270 214)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <path d="M5 12 H10 M14 12 H19 M12 5 V9 M12 15 V19" fill="none" stroke="#8ff0bf" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="304" y="226" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">HTTP outbound</text>
    <text x="270" y="256" class="mono" font-size="11" fill="#718078">método · status · destino · duração</text>

    <rect x="464" y="196" width="196" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(482 214)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <rect x="6" y="7" width="12" height="10" rx="2" fill="none" stroke="#8ff0bf" stroke-width="2"/>
    </g>
    <text x="516" y="226" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">Laravel 9+</text>
    <text x="482" y="256" class="mono" font-size="11" fill="#718078">auto-discovery do service provider</text>

    <rect x="676" y="196" width="184" height="78" rx="10" fill="#0f1a15" stroke="#222f29"/>
    <g transform="translate(694 214)">
      <rect width="24" height="24" rx="6" fill="#122019" stroke="#2a5a44"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="#8ff0bf" stroke-width="2"/>
      <circle cx="12" cy="12" r="2.5" fill="#8ff0bf"/>
    </g>
    <text x="728" y="226" class="ui" font-size="13" font-weight="600" fill="#e8f0eb">100% local</text>
    <text x="694" y="256" class="mono" font-size="11" fill="#718078">tudo em um único arquivo</text>
  </g>
</svg>

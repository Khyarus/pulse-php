<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="PulsePHP — observabilidade local para PHP e Laravel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b100e"/>
      <stop offset="0.55" stop-color="#0e1613"/>
      <stop offset="1" stop-color="#0b100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#42c98a" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#42c98a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#42c98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42c98a"/>
      <stop offset="0.5" stop-color="#8ff0bf"/>
      <stop offset="1" stop-color="#42c98a"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42c98a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#42c98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#42c98a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
      .sub   { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .mono  { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#1a2723" stroke-width="1" opacity="0.65">
    <path d="M0 60 H1280 M0 120 H1280 M0 180 H1280 M0 240 H1280 M0 300 H1280"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360 M640 0 V360 M800 0 V360 M960 0 V360 M1120 0 V360"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96 96)">
    <rect width="76" height="76" rx="18" fill="#143b2c" stroke="#2a5a44" stroke-width="1.5"/>
    <path d="M16 40 H28 L34 24 L44 56 L52 34 L58 44 H62"
          fill="none" stroke="url(#pulse)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="200" y="150" class="title" font-size="72" fill="#e8f0eb">Pulse<tspan fill="#42c98a">PHP</tspan></text>
  <text x="204" y="196" class="sub" font-size="26" fill="#9aa9a1">Observabilidade e telemetria local para PHP &amp; Laravel</text>

  <!-- tags -->
  <g class="mono" font-size="15" text-anchor="middle">
    <rect x="204" y="222" rx="14" ry="14" width="146" height="30" fill="#122019" stroke="#2a5a44"/>
    <text x="277" y="242" fill="#8ff0bf">SQLite local</text>
    <rect x="366" y="222" rx="14" ry="14" width="208" height="30" fill="#122019" stroke="#2a5a44"/>
    <text x="470" y="242" fill="#8ff0bf">Zero infraestrutura</text>
    <rect x="590" y="222" rx="14" ry="14" width="246" height="30" fill="#122019" stroke="#2a5a44"/>
    <text x="713" y="242" fill="#8ff0bf">Dashboard em tempo real</text>
  </g>

  <defs>
    <!-- Gradient para garantir o efeito bonito de cauda/fade se estiver usando stroke="url(#stroke)" -->
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42c98a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#42c98a" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Linha do ECG -->
  <path id="ecg-path" 
        d="M0 320 H760 L796 320 L820 262 L852 350 L884 288 L912 320 H1280"
        fill="none" 
        stroke="url(#stroke)" 
        stroke-width="3" 
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-dasharray="1280"
        stroke-dashoffset="1280">
    <animate 
      attributeName="stroke-dashoffset" 
      values="1280; 0; -1280" 
      dur="2.4s" 
      repeatCount="indefinite" 
      keyTimes="0; 0.75; 1"
      calcMode="linear" />
  </path>

  <!-- Bolinha e Efeito de Glow sincronizados -->
  <g>
    <!-- Ponto Central Sólido -->
    <circle cx="0" cy="0" r="4.5" fill="#42c98a" />
    
    <!-- Pulso Externo da Bolinha -->
    <circle cx="0" cy="0" r="4.5" fill="#42c98a" opacity="0.6">
      <animate attributeName="r" values="4.5;14;4.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Animação de Movimento Alinhada -->
    <animateMotion 
      dur="2.4s" 
      repeatCount="indefinite" 
      keyPoints="0; 1; 1" 
      keyTimes="0; 0.75; 1" 
      calcMode="linear">
      <mpath href="#ecg-path"/>
    </animateMotion>

    <!-- Esconde a bolinha durante a pausa entre os batimentos para não flutuar no final -->
    <animate 
      attributeName="opacity" 
      values="1; 1; 0; 0" 
      keyTimes="0; 0.74; 0.75; 1" 
      dur="2.4s" 
      repeatCount="indefinite" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="PulsePHP — observabilidade local para PHP e Laravel">
  <defs>
    <pattern id="minor" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#f7e1e4" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#minor)"/>
      <path d="M40 0H0V40" fill="none" stroke="#efc3c8" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf8f8" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fbf8f8" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#fbf8f8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="358" rx="14"/></clipPath>
    <style>
      .sans { font-family: 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#fbf8f8"/>
    <rect width="1280" height="360" fill="url(#major)"/>
    <rect width="1280" height="360" fill="url(#fade)"/>
    <!-- ECG trace across the paper -->
    <path d="M700 236 H760 l10 -14 l10 14 H830 l14 -110 l18 168 l14 -84 l10 30 H950 l12 -22 l12 22 H1060 l14 -110 l18 168 l14 -84 l10 30 H1180 l10 -14 l10 14 H1280"
          fill="none" stroke="#c8102e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="14" fill="none" stroke="#e8e1e6" stroke-width="2"/>

  <g transform="translate(72 104)">
    <path d="M0 22h16l5 -12 8 26 7 -20 4 6H64" fill="none" stroke="#c8102e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="38" class="sans" font-size="48" font-weight="600" fill="#221d33" letter-spacing="-1">Pulse<tspan fill="#857f97" font-weight="400">PHP</tspan></text>
  </g>

  <text x="72" y="206" class="sans" font-size="26" fill="#221d33">Observabilidade local para PHP e Laravel.</text>
  <text x="72" y="244" class="sans" font-size="19" fill="#565068">Requisições, erros, queries, jobs e logs num único arquivo SQLite.</text>

  <g class="sans" font-size="16" fill="#565068">
    <circle cx="78" cy="295" r="5" fill="#2e7d5b"/>
    <text x="92" y="301">Sem infraestrutura</text>
    <circle cx="262" cy="295" r="5" fill="#4f5b93"/>
    <text x="276" y="301">Dashboard embutido</text>
    <circle cx="456" cy="295" r="5" fill="#c8102e"/>
    <text x="470" y="301">PHP 8.1+ e Laravel 9+</text>
  </g>
</svg>

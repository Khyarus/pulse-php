name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, fileinfo
          coverage: none
      - name: Validate Composer configuration
        run: composer validate --strict
      # Laravel integration tests need orchestra/testbench, which requires PHP 8.2+.
      - name: Drop Laravel test dependencies on PHP 8.1
        if: matrix.php == '8.1'
        run: composer remove --dev orchestra/testbench --no-update
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist
      - name: Check code style
        if: matrix.php == '8.3'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Run core tests
        run: vendor/bin/phpunit --testsuite PulsePHP
      - name: Run Laravel integration tests
        if: matrix.php != '8.1'
        run: vendor/bin/phpunit --testsuite Laravel
      - name: Run smoke test
        run: php examples/test.php
